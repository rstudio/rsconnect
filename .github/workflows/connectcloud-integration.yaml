name: Connect Cloud Integration Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  connectcloud-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if Connect Cloud credentials are available (not on forks)
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CONNECT_CLOUD_CLIENT_ID: ${{ secrets.CONNECT_CLOUD_CLIENT_ID }}
      CONNECT_CLOUD_CLIENT_SECRET: ${{ secrets.CONNECT_CLOUD_CLIENT_SECRET }}
      CONNECT_CLOUD_ACCOUNT: ${{ secrets.CONNECT_CLOUD_ACCOUNT }}
      CONNECT_CLOUD_CONTENT_ID: ${{ secrets.CONNECT_CLOUD_CONTENT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            local::.
            any::testthat
            any::withr

      - name: Run Connect Cloud integration tests
        if: env.CONNECT_CLOUD_CLIENT_SECRET != ''
        run: |
          Rscript -e 'testthat::test_dir("tests/connectcloud-integration", package="rsconnect", load_package="installed")'
