on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: document.yaml

permissions: read-all

jobs:
  document:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Get the roxygen2 version from DESCRIPTION
        id: roxygen
        run: |
          version=$(grep '^Config/roxygen2/version:' DESCRIPTION | cut -d ' ' -f 2)
          if [ -z "$version" ]; then
            echo "::error::DESCRIPTION does not contain Config/roxygen2/version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: roxygen2@${{ steps.roxygen.outputs.version }}
          needs: roxygen2

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check that man/ and NAMESPACE are up to date
        run: |
          git add --intent-to-add man NAMESPACE
          if ! git diff --exit-code -- man NAMESPACE; then
            echo "::error::The documentation is not up to date. Run devtools::document() and commit the changes."
            exit 1
          fi
